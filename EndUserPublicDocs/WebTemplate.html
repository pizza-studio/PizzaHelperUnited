<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<!-- [TO COPILOT] MODIFY THE TITLE TO MATCH THE DOCUMENT NAME (FAQ / EULA / PRIVACY POLICY). -->
	<title>DOCUMENT NAME</title>
	<style>
		/* General reset */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
				Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
			background-color: #ffffff;
			color: #24292e;
			line-height: 1.5;
			padding: 2rem;
			transition: background-color 0.3s, color 0.3s;
		}

		/* Dark mode */
		@media (prefers-color-scheme: dark) {
			body {
				background-color: #0d1117;
				color: #c9d1d9;
			}

			header {
				border-bottom: none;
			}

			.language-selector {
				background-color: #161b22;
				color: #c9d1d9;
				border: 1px solid #30363d;
			}

			code,
			pre {
				background-color: #161b22;
				border: 1px solid #30363d;
			}
		}

		header {
			align-items: leading;
		}

		.language-selector {
			font-size: 1rem;
			padding: 0.5rem;
			border: 1px solid #d0d7de;
			border-radius: 6px;
			background-color: #f6f8fa;
			color: #24292e;
		}

		hr {
			opacity: 0.1;
		}

		main {
			padding: 0;
		}

		@media (max-width: 600px) {
			body {
				padding: 1rem;
			}
		}

		/* GitHub Markdown CSS */
		h1,
		h2,
		h3,
		h4,
		h5,
		h6 {
			margin-top: 1em;
			margin-bottom: 0.5em;
			font-weight: 600;
			line-height: 1.25;
		}

		h2 {
		    border-bottom: 0.1em solid;
		    border-right: 1em solid;
		    padding-right: 0.5em;
		}

		h3 {
			background-color: #114514;
			color: white;
			padding: 5px;
		}

		h4 {
		    border-left: 0.5em solid;
		    border-bottom: 0.05em solid;
		    padding: 0.25em 0.5em;
		}

		h1 {
			text-align: center;
			margin-top: 1em;
			margin-bottom: 1em;
		}

		p {
			margin-bottom: 1em;
		}

		a {
			color: #0366d6;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		ul,
		ol {
			padding-left: 2em;
			margin-bottom: 1em;
		}

		blockquote {
			padding: 0.5em 1em;
			border-left: 0.25em solid #d0d7de;
			margin-bottom: 0.5em;
			opacity: 0.7;
			/* Reduced space at the bottom */
		}

		code {
			font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
				Courier, monospace;
			font-size: 85%;
			padding: 0.2em 0.4em;
			border-radius: 6px;
		}

		pre {
			font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
				Courier, monospace;
			font-size: 85%;
			line-height: 1.45;
			background-color: #f6f8fa;
			padding: 1em;
			border-radius: 6px;
			overflow: auto;
			border: none;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 1em;
		}

		th,
		td {
			border: 1px solid #d0d7de;
			padding: 0.6em;
		}

		th {
			background-color: #f6f8fa;
			font-weight: 600;
		}

		/* Hide all content divs by default */
		.content {
			display: none;
		}

		/* Show content div when it is active */
		.content.active {
			display: block;
		}
	</style>
	<script>
		// The languages shipped by this document, in the preferred order.
		const supportedLanguages = ["en-US", "zh-Hant", "zh-Hans", "ja-JP"];

		// Every language which this document does not ship falls back to English.
		// Never default to Simplified Chinese here: someone who never asked for
		// Chinese contents must not be greeted with Simplified Chinese ones.
		const fallbackLanguage = "en-US";

		function normalizeLanguageTag(tag) {
			return String(tag || "")
				.trim()
				.replace(/_/g, "-")
				.toLowerCase();
		}

		// Resolves any BCP-47 language tag (e.g. "en-GB", "zh-CN", "zh-Hant-HK")
		// into one of the languages shipped by this document. Any other language
		// is reported as `null`, so that the caller uses the English fallback.
		function resolveSupportedLanguage(tag) {
			const normalizedTag = normalizeLanguageTag(tag);
			if (!normalizedTag) return null;

			const exactMatch = supportedLanguages.find(
				(language) => normalizeLanguageTag(language) === normalizedTag
			);
			if (exactMatch) return exactMatch;

			const [primaryLanguage, ...subTags] = normalizedTag.split("-");
			switch (primaryLanguage) {
				case "en":
					return "en-US";
				case "ja":
					return "ja-JP";
				case "zh": {
					// "zh" alone means Simplified Chinese according to CLDR's likely
					// subtags, whereas region-specific tags (such as "zh-TW") have to
					// be normalized into the script-specific tags used by this document.
					const traditionalTokens = ["hant", "tw", "hk", "mo"];
					const simplifiedTokens = ["hans", "cn", "sg", "my"];
					if (subTags.some((token) => traditionalTokens.includes(token))) {
						return "zh-Hant";
					}
					if (subTags.some((token) => simplifiedTokens.includes(token))) {
						return "zh-Hans";
					}
					return "zh-Hans";
				}
				default:
					return null;
			}
		}

		// The browser's primary language: the only one which decides the language
		// of this document. Secondary preferences are ignored on purpose, so a
		// device whose main language is not shipped here always gets English.
		function browserPrimaryLanguageTag() {
			const tags = [];
			if (Array.isArray(navigator.languages)) tags.push(...navigator.languages);
			[navigator.language, navigator.userLanguage].forEach((tag) => {
				if (tag && !tags.includes(tag)) tags.push(tag);
			});
			return tags.find((tag) => normalizeLanguageTag(tag)) || "";
		}

		function detectLanguage() {
			const language =
				resolveSupportedLanguage(browserPrimaryLanguageTag()) || fallbackLanguage;
			document.getElementById("language-selector").value = language;
			changeLanguage(); // Call changeLanguage to set the correct content visibility
		}

		function changeLanguage() {
			const language = document.getElementById("language-selector").value;
			const contentDivs = document.querySelectorAll(".content");
			contentDivs.forEach((div) => div.classList.remove("active"));
			const selectedContent = document.getElementById(`content-${language}`);
			if (selectedContent) {
				selectedContent.classList.add("active");
				document.documentElement.lang =
					selectedContent.getAttribute("lang") || language;
			}
		}

		// DOMContentLoaded (instead of window.onload) applies the detected language
		// before images and any other subresource finishes loading.
		document.addEventListener("DOMContentLoaded", detectLanguage);
	</script>
</head>

<body>
	<header>
		<select id="language-selector" class="language-selector" onchange="changeLanguage()">
			<option value="en-US">English</option>
			<option value="zh-Hant">繁體中文 (Traditional Chinese)</option>
			<option value="zh-Hans">简体中文 (Simplified Chinese)</option>
			<option value="ja-JP">日本語 (Japanese)</option>
		</select>
		<span> ← 🌐</span>
	</header>
	<main>
		<div id="content-en-US" class="content active" lang="en">
			<!-- [TO COPILOT] en-US contents is expected to be inserted here. -->
		</div>
		<div id="content-zh-Hant" class="content" lang="zh-Hant">
			<!-- [TO COPILOT] zh-Hant (zh-TW) contents is expected to be inserted here. -->
		</div>
		<div id="content-zh-Hans" class="content" lang="zh-Hans">
			<!-- [TO COPILOT] zh-Hans (zh-CN) contents is expected to be inserted here. -->
		</div>
		<div id="content-ja-JP" class="content" lang="ja">
			<!-- [TO COPILOT] ja-JP contents is expected to be inserted here. -->
		</div>
	</main>
</body>

</html>
